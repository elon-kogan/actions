# Dependabot version updates for the actions each workflow calls. A bump
# arrives as a PR that moves the SHA and the version comment together;
# merging it changes nothing for callers until the v1 tag is moved onto it.
# The one pin it does not see is lint.yml's docker:// image, bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
