# Reusable: build the caller's image and push it to GHCR as <image>:sha-<7>,
# where <7> is the first seven hex characters of the caller's commit. That
# single tag is the whole contract with the cluster: ArgoCD Image Updater
# accepts tags matching ^sha-[0-9a-f]{7}$ and nothing else, so there is no
# `latest` and no branch tag. The deploy itself is not here — the Updater
# opens a PR that writes the tag into the chart values, and merging it is
# the deploy.
#
# The caller owns the trigger (push to main, paths-ignore for commits that
# change nothing inside the image) and grants `packages: write`. The package
# must give the calling repository write access (its "Manage Actions
# access" setting) when it predates the workflow — it is not linked
# automatically.
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag.
        type: string
        default: ghcr.io/${{ github.repository }}
      target:
        description: >
          The Dockerfile stage to ship; named so a stage added later cannot
          silently become the image.
        type: string
        default: prod
      platforms:
        description: >
          Platforms to build for. One is enough while nothing else pulls the
          image; a second doubles the build.
        type: string
        default: linux/amd64

jobs:
  build:
    # A caller's workflow_dispatch can be pointed at any branch or tag, and
    # an image built from it would carry a sha-<7> tag the Updater accepts.
    # Only commits on main become images.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR does not make tags immutable; this step does. A rebuild of the
      # same commit would start from a moved base image and today's apt
      # packages, so the same tag would come to mean different bytes — a
      # deployed or rollback image silently replaced. If the tag is there,
      # there is nothing to recover; if the registry cannot be asked, do not
      # guess.
      - name: Refuse to overwrite an existing tag
        env:
          IMAGE: ${{ inputs.image }}:sha-${{ steps.sha.outputs.short }}
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists and tags are immutable; this commit is not rebuilt."
            exit 1
          fi
          case "$out" in
            *"no such manifest"*|*"manifest unknown"*|*MANIFEST_UNKNOWN*|*"not found"*)
              echo "$IMAGE is new" ;;
            *)
              echo "::error::could not check whether $IMAGE exists: $out"
              exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:sha-${{ steps.sha.outputs.short }}
          # Lets GitHub link the package to the calling repository and show
          # the commit the image came from.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # GitHub Actions cache, scoped to the caller: the dependency layer
          # survives between builds unless its inputs changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
