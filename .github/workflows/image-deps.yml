# Reusable: build one Dockerfile stage of the caller — by default `deps`, the
# dependency install inside the image — without pushing anything. The
# caller's CI installs gems in the full checkout on the runner's Ruby, so it
# cannot see a Dockerfile that forgets to COPY a file bundler needs, or a
# base-image bump whose Ruby no longer matches .ruby-version and the lock.
# Those fail only on main, in the real build, after the merge. This is that
# failure moved in front of the merge.
#
# Nothing is pushed: no registry login, no tag, so a Dependabot PR with its
# read-only token runs it like any other. The caller owns the trigger and
# its paths filter (Dockerfile, lock files, .ruby-version).
name: Image deps

on:
  workflow_call:
    inputs:
      target:
        description: >
          The Dockerfile stage to build. The final stage would also compile
          assets and prune, which CI already exercises and which a
          base-image / lock mismatch never reaches.
        type: string
        default: deps
      platforms:
        description: >
          Same platforms as the real build, so the base image resolved here
          is the one that build will pull. The runner's own platform only,
          as there: no QEMU is set up for another.
        type: string
        default: linux/amd64

jobs:
  deps:
    # Third level of the check's name (what / where / how): how, as in ci.yml.
    name: docker build --target ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: false
          # Read the cache the image build writes from main; a PR that
          # changes nothing a layer depends on finishes in seconds. No
          # cache-to: pull-request caches are scoped away from main's anyway.
          cache-from: type=gha
